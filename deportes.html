<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto - Menú de Deportes</title>
    <style>
        :root {
            --gold: #ffd700;
            --dark-green: #0e1a11;
            --light-green: #1b4d3e;
        }

        body {
            background-color: var(--dark-green);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Cabecera de Usuario */
        .header-user {
            width: 100%;
            background: rgba(0,0,0,0.5);
            padding: 15px 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-bottom: 2px solid var(--gold);
        }

        .balance-box {
            font-size: 1.2rem;
            color: var(--gold);
            font-weight: bold;
        }

        h1 {
            margin: 40px 0;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        /* Contenedor de Deportes */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 1000px;
            padding: 20px;
        }

        .card {
            background: var(--light-green);
            border: 2px solid transparent;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--gold);
            background: #246350;
        }

        .card .icon {
            font-size: 60px;
            margin-bottom: 15px;
            display: block;
        }

        .card span {
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* Botón de Mis Apuestas */
        .mis-apuestas-btn {
            margin-top: 50px;
            padding: 15px 40px;
            background-color: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .mis-apuestas-btn:hover {
            background-color: var(--gold);
            color: black;
        }

        @media (max-width: 600px) {
            .menu-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="header-user">
        <div id="user-name">👤 <span id="nombre-usuario">Invitado</span></div>
        <div class="balance-box">💰 $<span id="balance-val">0.00</span></div>
    </div>

    <h1>Apuestas Deportivas</h1>

    <div class="menu-grid">
        <a href="apuestas_deportivas/futbol.html" class="card">
            <span class="icon">⚽</span>
            <span>FÚTBOL</span>
        </a>

        <a href="apuestas_deportivas/tenis.html" class="card">
            <span class="icon">🎾</span>
            <span>TENIS</span>
        </a>

        <a href="apuestas_deportivas/baloncesto.html" class="card">
            <span class="icon">🏀</span>
            <span>BALONCESTO</span>
        </a>
    </div>

    <a href="mis-apuestas.html" class="mis-apuestas-btn">📋 VER MIS APUESTAS</a>

    <script>
        // Lógica para cargar el balance real desde localStorage
        function cargarDatos() {
            const session = JSON.parse(localStorage.getItem('session'));
            if (session) {
                document.getElementById('nombre-usuario').innerText = session.user;
                document.getElementById('balance-val').innerText = parseFloat(session.balance).toFixed(2);
            } else {
                // Si no hay sesión, podrías redirigir al login
                // window.location.href = 'index.html';
            }
        }

        // Ejecutar al cargar la página
        window.onload = cargarDatos;
    </script>

</body>
</html>
